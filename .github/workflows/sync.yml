name: Synchronisation Pronote Calendrier

on:
  schedule:
    # Exécution à 06:00, 11:30 et 17:30 UTC (8h, 13h30, 19h30 heure française)
    - cron: '0 6,11,17 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/bain3/pronotepy.git icalendar

      - name: 🔄 Mettre à jour l'emploi du temps
        env:
          PRONOTE_CREDENTIALS: ${{ secrets.PRONOTE_CREDENTIALS }}
        run: |
          python generate_calendar.py

      - name: 🚀 Sauvegarder et publier l'agenda
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pronote.ics
          if git diff --staged --quiet; then
            echo "Aucune modification dans l'emploi du temps."
          else
            git commit -m "Mise à jour automatique de l'emploi du temps [skip ci]"
            git push
          fi
